[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epspsclass"
version = "1.0.4"
description = "Open-source reimplementation of the EPSPSClass EPSPS glyphosate-sensitivity classifier (Leino et al. 2021)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "EPSPS Evolutionary Genomics Project" },
]
keywords = ["glyphosate", "EPSPS", "bioinformatics", "herbicide resistance", "bacteria"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.79",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
]
aws = [
  "boto3>=1.26",
]

[project.scripts]
epspsclass = "epspsclass.cli:main"

[project.urls]
Homepage = "https://github.com/claratucker/epspsclass"
"Bug Tracker" = "https://github.com/claratucker/epspsclass/issues"
Changelog = "https://github.com/claratucker/epspsclass/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["epspsclass*"]

[tool.setuptools.package-data]
epspsclass = ["data/reference_sequences/*.fasta"]

[tool.setuptools.data-files]
"share/epspsclass/scripts" = ["scripts/derive_markers.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

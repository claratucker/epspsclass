AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EPSPSClass compute environment — EC2 instance with S3 access for
  large-scale EPSPS classification.  Use this template to provision a
  reproducible, IAM-role-secured compute environment without hard-coded
  credentials.

# ─── Parameters ────────────────────────────────────────────────────────────
Parameters:

  InstanceType:
    Type: String
    Default: c6i.2xlarge
    AllowedValues:
      - t3.medium
      - c6i.xlarge
      - c6i.2xlarge
      - c6i.4xlarge
      - r6i.2xlarge
    Description: >
      Instance type.  c6i.2xlarge (8 vCPU / 16 GB) is recommended for
      batches of 5,000–10,000 sequences.  Scale up for larger datasets.

  S3BucketName:
    Type: String
    Description: >
      Name of the S3 bucket that will hold input FASTAs and output TSVs.
      Must already exist.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access (optional; use SSM instead).

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 latest AMI (resolved automatically).

# ─── Resources ─────────────────────────────────────────────────────────────
Resources:

  # IAM role — grants EC2 read/write access to the S3 bucket only
  EPSPSClassRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "epspsclass-role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # SSM Session Manager
      Policies:
        - PolicyName: S3BucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"

  EPSPSClassInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EPSPSClassRole

  # Security group — no inbound SSH required if using SSM Session Manager
  EPSPSClassSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EPSPSClass compute instance — outbound only
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"

  # EC2 instance
  EPSPSClassInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref EPSPSClassInstanceProfile
      SecurityGroups:
        - !Ref EPSPSClassSG
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50    # GB — sufficient for NCBI RefSeq EPSPS sequences
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          # System update
          dnf update -y

          # Python 3.11
          dnf install -y python3.11 python3.11-pip git

          # Install EPSPSClass
          pip3.11 install "epspsclass[aws]"

          # Download reference sequences
          epspsclass download-refs

          # Signal CloudFormation that setup is complete
          /opt/aws/bin/cfn-signal -e $? \
            --stack  ${AWS::StackName} \
            --region ${AWS::Region} \
            --resource EPSPSClassInstance
      Tags:
        - Key: Name
          Value: !Sub "epspsclass-${AWS::StackName}"
        - Key: Project
          Value: EPSPS-Evolutionary-Genomics

    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

# ─── Outputs ───────────────────────────────────────────────────────────────
Outputs:

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref EPSPSClassInstance

  SSMConnectCommand:
    Description: Connect via SSM Session Manager (no SSH key needed)
    Value: !Sub "aws ssm start-session --target ${EPSPSClassInstance} --region ${AWS::Region}"

  ExampleBatchCommand:
    Description: Example Python one-liner to run a batch classification job
    Value: !Sub |
      python3 -c "
      from epspsclass.aws import run_batch_from_s3
      run_batch_from_s3(
          input_s3_uri  = 's3://${S3BucketName}/input/epsps_sequences.fasta',
          output_s3_uri = 's3://${S3BucketName}/results/classification.tsv',
      )"
